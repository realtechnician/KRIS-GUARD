# Start with:   docker compose up -d --build
# Stop with:    docker compose down          (your data stays in the volume)
#
# Settings and secrets come from the .env file next to this one.
# Copy .env.example to .env and fill it in first.

services:
  kris-guard:
    build: .
    image: kris-guard:0.1.0
    restart: unless-stopped
    env_file: .env
    ports:
      # Only reachable from this machine. Put an HTTPS reverse proxy (Caddy,
      # nginx) in front to serve clients on other machines. See README.md.
      - "127.0.0.1:8080:8080"
    volumes:
      # The database and the signed checkpoint files.
      - kris-guard-data:/data
      # One policy file per client. Edit them here on the host.
      - ./config/policies:/app/config/policies
    # Hardening: the container cannot change its own files or gain privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # OPTIONAL PostgreSQL. SQLite (a single file in the data volume) is the
  # default and is enough for most setups. To use PostgreSQL instead:
  #   1. set POSTGRES_PASSWORD and DATABASE_URL in .env (see .env.example)
  #   2. start with:  docker compose --profile postgres up -d --build
  postgres:
    profiles: ["postgres"]
    image: postgres:16.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: krisguard
      POSTGRES_DB: krisguard
      # PostgreSQL refuses to start if this is empty.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - kris-guard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krisguard -d krisguard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kris-guard-data:
  kris-guard-postgres:
